services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gptapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [gptapp_pg:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gptapp
    ports: ['8000:8000']
    depends_on: [postgres]
volumes:
  gptapp_pg:
